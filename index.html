<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hinário 5">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./css/style.css?v=10">
<title>Hinário 5 – CCB</title>
</head>
<body>
<header>
  <h1>Hinário 5 <span>Congregação Cristã No Brasil</span></h1>
  <nav class="abas" id="abas">
    <button data-aba="Culto oficial" class="ativa">CULTO OFICIAL</button>
    <button data-aba="Jovens e menores">CULTO JOVENS E MENORES</button>
    <button data-aba="Santa Ceia">SANTA CEIA</button>
    <button data-aba="Funeral">FUNERAL</button>
    <button data-aba="Batismo">BATISMO</button>
    <button data-aba="Coros">COROS</button>
    <button data-aba="finais">PARTITURAS</button>
  </nav>
</header>

<main>
  <!-- ABAS DE HINOS (a mesma tela serve para todas as categorias) -->
  <div id="abaHinos">
    <section class="card" id="filtros">
      <label for="busca">Pesquisar por número, título ou trecho da letra</label>
      <input id="busca" type="search" placeholder="Ex.: 125, título ou trecho" autocomplete="off">
      <div class="linhaFiltro">
        <label class="check"><input id="favOnly" type="checkbox"> Só favoritos</label>
      </div>
    </section>
    <h2 id="tituloLista">Hinos</h2>
    <div id="lista"></div>
    <div id="vazio" hidden></div>

    <section id="detalhe" class="card" hidden>
      <div class="barra">
        <button id="voltar">← Voltar</button>
        <div class="fonte">
          <button id="fonteMenos" aria-label="Diminuir letra">A−</button>
          <button id="fonteMais" aria-label="Aumentar letra">A+</button>
        </div>
      </div>
      <h2 id="titulo"></h2>
      <p id="catHino" class="nota"></p>
      <div class="acoesHino">
        <button id="favorito">☆ Favoritar</button>
        <button id="verPartitura">🎼 Partitura</button>
        <select id="tom" aria-label="Arquivo da partitura" hidden></select>
      </div>
      <div id="texto"></div>
      <div id="partitura" hidden></div>
      <div class="navHino">
        <button id="anterior">‹ Anterior</button>
        <button id="proximo">Próximo ›</button>
      </div>
    </section>
  </div>

  <!-- ABA PARTITURAS -->
  <div id="abaFinais" hidden>
    <section class="card">
      <p class="nota">Toque em uma partitura para abrir o arquivo completo.</p>
      <div id="listaFinais"></div>
    </section>
  </div>
</main>

<!-- Visualizador do PDF completo -->
<div id="visor" hidden>
  <div class="visorBarra">
    <button id="visorFechar">← Fechar</button>
    <strong id="visorTitulo"></strong>
    <div class="fonte">
      <button id="zoomMenos" aria-label="Diminuir zoom">−</button>
      <button id="zoomMais" aria-label="Aumentar zoom">+</button>
    </div>
  </div>
  <div id="visorPaginas"></div>
</div>

<footer>Deus seja Louvado</footer>
<div id="erroApp" hidden></div>
<script>
// Mostra na tela qualquer erro, para facilitar o diagnóstico
addEventListener('error', e => { const d = document.getElementById('erroApp'); d.hidden = false; d.textContent = 'Erro: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')'; });
addEventListener('unhandledrejection', e => { const d = document.getElementById('erroApp'); d.hidden = false; d.textContent = 'Erro: ' + (e.reason && e.reason.message || e.reason); });
</script>
<script src="./js/app.js?v=10"></script>
</body>
</html>
